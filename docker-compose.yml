services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      INFERENCE_DEPLOYMENT_NAME: ${INFERENCE_DEPLOYMENT_NAME:-ollama/${OLLAMA_MODEL_NAME:-qwen3.5:0.8b}}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://ollama:11434}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-ollama}
      EMBEDDINGS_DEPLOYMENT_NAME: ${EMBEDDINGS_DEPLOYMENT_NAME:-ollama/all-minilm:l6-v2}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-http://ollama:11434}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-ollama}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:8000
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-qwen3.5:0.8b}
      OLLAMA_EMBEDDING_MODEL_NAME: ${OLLAMA_EMBEDDING_MODEL_NAME:-all-minilm:l6-v2}
      INFERENCE_DEPLOYMENT_NAME: ${INFERENCE_DEPLOYMENT_NAME:-ollama/${OLLAMA_MODEL_NAME:-qwen3.5:0.8b}}
    command:
      - |
        set -eu
        export OLLAMA_HOST=http://ollama:11434
        case "$$INFERENCE_DEPLOYMENT_NAME" in
          ollama/*|ollama_chat/*) model=$${INFERENCE_DEPLOYMENT_NAME#*/} ;;
          *) model=$$OLLAMA_MODEL_NAME ;;
        esac
        ollama pull "$$model"
        ollama pull "$$OLLAMA_EMBEDDING_MODEL_NAME"

volumes:
  ollama-data:
