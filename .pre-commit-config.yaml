# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# ruff is for python files and is used with ruff.toml

# jupyter_jupyterlab_server_config.py is based on a large autogenerated file.
# There is no value in checking it.
exclude: "notebook.ipynb"


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=3000']
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      #      - id: requirements-txt-fixer
      #        exclude: ^requirements/.*$
      - id: trailing-whitespace # This hook trims trailing whitespace
      - id: check-merge-conflict # Check for files that contain merge conflict strings
      - id: mixed-line-ending # Enforce Unix (LF) line endings
        args: [ --fix=lf ]
        exclude: \.(bat|ps1|reg)$ # These stay CRLF per .gitattributes
      - id: name-tests-test
        args: [ --pytest-test-first ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  -   repo: https://github.com/Yelp/detect-secrets
      rev: v1.5.0
      hooks:
        -   id: detect-secrets
            args: ['--exclude-files', 'notebook.ipynb',
                   '--exclude-files', 'with-glazewm.html',
                   '--exclude-lines','infoHash.*c352d6801679cb6561060988a89458f6728b4377',
            ]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types: [markdown]
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mkdocs-build
        name: properdocs build --strict
        entry: bash -c 'export PATH="$HOME/.local/bin:$PATH"; uv run properdocs build -f properdocs.yml --strict --quiet --site-dir "$(mktemp -d)"'
        language: system
        files: ^(docs/|properdocs\.yml$|[^/]+\.md$)
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      # Rewrite the lockfile, then fail if it changed: pre-commit discards hook rewrites
      # (pass_filenames: false), so without --check a stale lock reports "Passed" and merges.
      - id: uv-lock
        args: [--check]

