# =============================================================================
# Reusable Workflow — 👷 Quality Check & Tests
# =============================================================================
# Shared by: ci.yml, main-release.yml, dev-release.yml
# Runs pre-commit first, then tests sequentially.
# =============================================================================
name: "👷 Quality Check & Tests"

on:
  workflow_call:

permissions:
  contents: read

jobs:

  pre-commit:
    name: "🧹 Pre-commit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python Dependencies
        uses: ./.github/actions/install-python-deps

      - name: Run Pre-commit
        id: pre_commit
        shell: bash
        run: |
          echo "::group::Pre-commit output"
          make pre-commit
          echo "::endgroup::"

      - name: Cleanup Artifacts
        if: always()
        uses: ./.github/actions/cleanup-artifacts

  tests:
    name: Full software validation (test-all)
    runs-on: ubuntu-latest
    needs: pre-commit
    timeout-minutes: 40
    env:
      OLLAMA_MODEL_NAME: ${{ vars.INTEGRATION_OLLAMA_MODEL || 'qwen3.5:0.8b' }}
      OLLAMA_MODELS: ${{ runner.temp }}/integration-ollama-models
      INFERENCE_BASE_URL: http://127.0.0.1:11434
      INFERENCE_API_KEY: ollama # pragma: allowlist secret (local unauthenticated service placeholder)
      INFERENCE_DEPLOYMENT_NAME: ollama/${{ vars.INTEGRATION_OLLAMA_MODEL || 'qwen3.5:0.8b' }}
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-python-deps
      - name: Install the integration service
        run: make install-ollama
      - name: Start dedicated Ollama and provision its model
        shell: bash
        run: |
          nohup ollama serve > "$RUNNER_TEMP/integration-ollama.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/integration-ollama.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo '::error::Dedicated Ollama is unavailable; full integration validation cannot run.'
            exit 1
          fi
          ollama pull "$OLLAMA_MODEL_NAME"
      - name: make test-all (unit, component and real LLM/Ollama/API integration)
        id: software
        run: make test-all
      - name: Report comprehensive validation status
        if: always()
        env:
          SOFTWARE_RESULT: ${{ steps.software.outcome }}
        run: |
          if [ "$SOFTWARE_RESULT" = success ]; then
            echo 'Comprehensive software validation passed, including integration execution.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full software validation is incomplete: make test-all failed or did not run. A focused/local-only pass is insufficient.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the dedicated integration service
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/integration-ollama.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/integration-ollama.pid")" 2>/dev/null || true
          fi
      - if: always()
        uses: ./.github/actions/cleanup-artifacts
