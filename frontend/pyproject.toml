[project]
name = "genai-template-frontend"
version = "2.0.0"
description = "This is the frontend for the Generative ai project template."
requires-python = ">=3.12,<=3.14.8"
dependencies = [
  "nicegui>=3.8.0",
  "httpx==0.28.1",
  "loguru>=0.7.3",
  "pydantic==2.13.5",
  "pydantic-settings>=2.12.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
