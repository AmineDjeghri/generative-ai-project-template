[project]
name = "genai-template-frontend"
version = "1.0.2"
description = "This is the frontend for the Generative ai project template."
requires-python = ">=3.14.0,<=3.15.2"
dependencies = [
  # software engineering & api
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "loguru==0.7.3",
  "httpx==0.28.1",

  # UI
  "nicegui>=3.8.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<=1.33.0"]
build-backend = "hatchling.build"
